# Save as .github/workflows/profile.yml in your eseoghene94/eseoghene94 repo
# (this replaces snake.yml — delete that one if you already added it)
#
# One-time setup:
#   1. Create a classic personal access token at github.com/settings/tokens
#      with scopes: public_repo, read:user  (add "repo" if you want private stats counted)
#   2. In the profile repo: Settings → Secrets and variables → Actions → New secret
#      Name: METRICS_TOKEN   Value: the token
#   3. Actions tab → "Update profile cards" → Run workflow

name: Update profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.svg", "profile-summary-card-output/**"]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  # ── lowlighter/metrics: stats, languages, calendar, habits, achievements, projects
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          config_timezone: Africa/Lagos
          base: header, activity, community, repositories
          committer_message: "chore: update overview card"

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          config_timezone: Africa/Lagos
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss
          committer_message: "chore: update languages card"

      - name: Contribution calendar & streaks
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          config_timezone: Africa/Lagos
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_message: "chore: update calendar card"

      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          config_timezone: Africa/Lagos
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          committer_message: "chore: update habits card"

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          config_timezone: Africa/Lagos
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8
          committer_message: "chore: update achievements card"

      - name: Featured projects
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.projects.svg
          config_timezone: Africa/Lagos
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: e-commerce-platform, social-media-app
          committer_message: "chore: update projects card"

  # ── github-profile-summary-cards: the four summary charts
  summary-cards:
    needs: metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 1

  # ── Platane/snk: contribution snake (pushed to the "output" branch)
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ff88
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
